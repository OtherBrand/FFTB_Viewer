## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/FFT_BattleGround
spring.datasource.username= postgres
spring.datasource.password= admin
server.servlet.contextPath=/
useIrc=true


# Boot 2.4->2.7 migration (R6): the 2020-era scheduled-task/factory wiring is deeply
# circular (tasks <-> factories); breaking each cycle is a separate de-cycling initiative
# with its own regression risk. This flag restores 2.4 behavior for the upgrade window.
# Cycles introduced by the wave (StatusService<->Twirk, CoreApplication<->IrcChatbotThread)
# are already properly broken via ObjectProvider.
spring.main.allow-circular-references=true

